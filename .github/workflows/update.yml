name: Update prices

on:
  schedule:
    # ساعت‌ها به UTC هستند: 00:40 و 08:40 و 16:40 UTC = 04:10 و 12:10 و 20:10 به وقت تهران
    - cron: "40 0,8,16 * * *"
  workflow_dispatch:   # امکان اجرای دستی از تب Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices
        run: python fetch_prices.py

      - name: Commit changes
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Update prices"
            git push
          fi
